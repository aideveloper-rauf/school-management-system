name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} · ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # Minimum supported database versions (docs/architecture.md → Data layer).
        db:
          - name: MySQL 8.0
            image: mysql:8.0
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - name: MariaDB 10.6
            image: mariadb:10.6
            health: healthcheck.sh --connect --innodb_initialized

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: school_sms_test
          MYSQL_USER: school_sms
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: school_sms
      DB_PASSWORD: ci-only-password
      TEST_DB_NAME: school_sms_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and HTTP tests
        run: npm test

      - name: MySQL integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
